<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Amira Magic Scan</title>
  <meta name="description" content="Scan a Dabur Amla Kids pack or the Amira card: Princess Amira's magic island appears and the game begins." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./scan.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <div id="ar"></div>
  <div id="flash"></div>

  <section id="intro">
    <div class="card">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
      <div class="targets" aria-hidden="true">
        <img src="./targets/oil.jpg" alt="" />
        <img src="./targets/detangler.jpg" alt="" />
        <img src="./targets/shampoo.jpg" alt="" />
        <img src="./targets/amira_card.jpg" alt="" />
      </div>
      <button id="btn-start" class="primary" data-i18n="start"></button>
      <p id="status" class="status" aria-live="polite"></p>
      <button id="btn-lang" class="link" data-i18n="lang"></button>
    </div>
  </section>

  <section id="hud" hidden>
    <div class="top">
      <button id="btn-close" class="icon" aria-label="Close">✕</button>
      <div id="hud-game" class="hud-game" hidden>
        <div class="row"><span id="hearts">❤️❤️❤️</span><b id="score-num">0</b></div>
        <div class="row"><span id="wave-num" class="wave-num">1/3</span><span class="wave-bar"><i id="wave-fill"></i></span></div>
      </div>
      <button id="btn-sound" class="icon" aria-label="Sound">🔊</button>
    </div>
    <div id="mission" class="mission" hidden></div>
    <div id="scan-hint" class="scan-hint">
      <div class="frame"><i></i><i></i><i></i><i></i></div>
      <span data-i18n="scanHint"></span>
    </div>
    <div id="bubble"></div>
    <div id="actions" class="actions" hidden>
      <button id="btn-dance" class="pill" data-i18n="dance"></button>
      <button id="btn-photo" class="pill big" data-i18n="photo"></button>
      <button id="btn-again" class="pill" data-i18n="again" hidden></button>
    </div>
  </section>

  <section id="win" hidden>
    <div class="win-card">
      <div class="badge">👑</div>
      <h2 data-i18n="winTitle"></h2>
      <div id="win-stars" class="stars"></div>
      <div id="win-score" class="win-score"></div>
      <p id="win-line"></p>
    </div>
  </section>

  <section id="shot" hidden>
    <div class="shot-card">
      <img id="shot-img" alt="" />
      <div class="shot-actions">
        <button id="btn-share" class="primary" data-i18n="share"></button>
        <button id="btn-shot-close" class="link" data-i18n="back"></button>
      </div>
    </div>
  </section>

  <script type="module" src="./scan.js"></script>
</body>
</html>
