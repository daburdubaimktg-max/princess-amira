<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Princess Amira AR</title>
  <meta name="description" content="Princess Amira's magic AR world — place her palace beach on your table and help her save her long, strong hair." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <!-- Everything here doubles as the WebXR DOM overlay in AR -->
  <div id="overlay">
    <section id="start">
      <div class="card">
        <div class="crown" aria-hidden="true">👑</div>
        <h1 data-i18n="title"></h1>
        <p data-i18n="subtitle"></p>
        <button id="btn-ar" class="primary" data-i18n="startAR"></button>
        <button id="btn-3d" class="secondary" data-i18n="start3D"></button>
        <p id="ar-note" class="note" data-i18n="noAR" hidden></p>
        <button id="btn-lang" class="link" data-i18n="lang"></button>
      </div>
    </section>

    <section id="hud" hidden>
      <div class="top">
        <button id="btn-home" class="icon" aria-label="Home">🏠</button>
        <div id="progress">
          <span data-i18n="bottles"></span>
          <i class="slot gold"></i><i class="slot pink"></i><i class="slot purple"></i>
        </div>
        <button id="btn-sound" class="icon" aria-label="Sound">🔊</button>
      </div>
      <div id="ar-hint" class="hint" data-i18n="findSurface" hidden></div>
      <div id="bubble"></div>
      <div class="bottom">
        <button id="btn-size" class="pill" hidden></button>
        <button id="btn-replay" class="pill primary" data-i18n="replay" hidden></button>
        <button id="btn-exit" class="pill" data-i18n="exit" hidden></button>
      </div>
    </section>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
